<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; object-src 'none'; base-uri 'none'">
  <title>非遗小火苗 · 桌宠</title>
  <link rel="stylesheet" href="style.css">
  <script src="pet-state.js" defer></script>
  <script src="renderer.js" defer></script>
</head>
<body>
  <header class="page-heading"><span class="brand-dot" aria-hidden="true"></span>非遗小火苗<span class="page-subtitle">你的非遗小伙伴</span></header>
  <main class="pet-home" aria-label="非遗桌宠">
    <div id="bubble" role="status" aria-live="polite"></div>
    <button id="pet" type="button" aria-label="小火苗：单击跳跃，双击演奏，按住拖动" aria-describedby="instructions">
      <span class="pet-art">
        <img id="pet-image" src="pet.png" alt="火焰头发、传统服饰、手持乐器的非遗小火人" draggable="false" width="1116" height="1409">
        <span class="sleep-mark" aria-hidden="true">Z<span>z</span><span>z</span></span>
      </span>
      <span id="missing-image" hidden>图片未能加载，请刷新重试</span>
    </button>
  </main>
  <footer class="page-help" id="instructions"><span>轻点 · 跳一跳</span><span>停留 · 摸摸头</span><span>双击 · 演奏</span><span>按住 · 拖动</span><small>拖到喜欢的位置，下次见面还在这里</small></footer>
</body>
</html>
